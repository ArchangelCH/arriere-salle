<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Rendue aussi par Chromium pour le PDF : rien d'autre que le coin lui-même, ni cadre, ni objet, ni formulaire. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma fiche · {{campagne.nom}}</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3E%3Cpolygon points='10,1 19,10 10,19 1,10' fill='%238e1b17'/%3E%3Cpolygon points='10,6 14,10 10,14 6,10' fill='%23f4ead4'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/fiche-aventurier.css">
</head>
<body data-mode="joueur">
  <div class="outils-fiche">
    <a class="retour" href="/">Retour à mon aventurier</a>
    <button type="button" data-action="imprimer">Imprimer</button>
    <a class="bouton-pdf" data-action="pdf" href="/fiche.pdf" download>Télécharger le PDF</a>
    <label><input type="checkbox" data-opt="verso" checked> Verso : histoire et carnet</label>
    <label><input type="checkbox" data-opt="eco"> Économique, sans parchemin</label>
    <p class="taille" aria-live="polite"></p>
  </div>
  <main class="feuilles" id="feuilles"><p class="chargement">Préparation de la fiche…</p></main>
  <script type="module" src="/static/js/aventuriers/fiche.js"></script>
</body>
</html>
